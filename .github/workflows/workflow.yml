name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rainshine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import runpy
          version = runpy.run_path("src/rainshine/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in {version, f"v{version}"}:
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r}.")
          PY
      - name: Install verified build tools
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-publish.lock'
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - name: Install built wheel without downloading dependencies
        run: 'python -m pip install --no-index --no-deps --only-binary :all: dist/*.whl'
      - name: Test installed package
        run: |
          rainshine --version
          rainshine --list-sites
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Publish distributions to PyPI
        # This Docker-backed action resolves its ref as a GHCR image tag.
        uses: pypa/gh-action-pypi-publish@v1.14.3
