name: Publish to PyPI

on:
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    name: Build, test, and publish
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/rainshine
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check release tag matches package version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import os
          import runpy
          version = runpy.run_path("src/rainshine/__init__.py")["__version__"]
          tag = os.environ["RELEASE_TAG"]
          if tag not in {version, f"v{version}"}:
              raise SystemExit(f"Release tag {tag!r} must match package version {version!r}.")
          PY
      - name: Install verified build tools
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-publish.lock'
      - name: Build source distribution and wheel
        run: python -m build --no-isolation
      - name: Install built wheel without downloading dependencies
        run: 'python -m pip install --no-index --no-deps --only-binary :all: dist/*.whl'
      - name: Test installed package
        run: |
          rainshine --version
          rainshine --list-sites
          xvfb-run -a python -m unittest discover -s tests -v
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
