name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.15.2'
      - name: Install locked dependencies
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-ci.lock'
      - name: Install local project
        # Dependencies and the build backend are already installed from the verified lockfile.
        run: 'python -m pip install --no-index --no-deps --no-build-isolation --only-binary :all: .'
      - run: python -m unittest discover -s tests -v
