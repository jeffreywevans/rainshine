name: Tests

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install locked dependencies
        run: 'python -m pip install --require-hashes --only-binary :all: -r requirements-ci.lock'
      - name: Install local project
        # Dependencies and the build backend are already installed from the verified lockfile.
        run: 'python -m pip install --no-index --no-deps --no-build-isolation --only-binary :all: .'
      - run: python -m unittest discover -s tests -v
